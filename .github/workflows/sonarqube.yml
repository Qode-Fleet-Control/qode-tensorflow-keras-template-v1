name: sonarqube
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  scan:
    # Only in the starter itself: a project made from it copies this file, but
    # sonar-project.properties names the starter's project and the copy's token may
    # not scan into it. Projects are scanned by Fleet Control's code-scan.yml.
    if: github.repository == 'Qode-Fleet-Control/qode-tensorflow-keras-template-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest coverage
      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage xml
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
